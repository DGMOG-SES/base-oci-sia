name: Atualizar base OCI (SIA-PA PE)

on:
  push:
    branches: [main]
    paths:
      - "oci_sia_pe.R"
      - "instalar_pacotes.R"
      - "dimensoes.R"
      - "painel_ate.R"
      - "referencias/**"
      - ".github/workflows/atualizar_oci.yml"
  schedule:
    # Duas checagens por dia (07h17 e 12h17 de Brasília). O GitHub atrasa ou pula
    # agendamentos em horários cheios, como hora cheia; a segunda cobre a primeira.
    # Só baixa quando há arquivo novo.
    - cron: "17 10 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras (ex.: --forcar=202503 ou --reprocessar-tudo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-oci
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::curl
            any::arrow
            any::remotes
            any::jsonlite

      - name: Instalar leitor de .dbc
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript instalar_pacotes.R
          pip install pyreaddbc

      - name: Extrair e consolidar
        id: extrair
        run: Rscript oci_sia_pe.R ${{ github.event.inputs.argumentos }}

      - name: Atualizar tabelas dimensão
        run: Rscript dimensoes.R

      # Roda mesmo se a atualização das dimensões falhar (ex.: SIGTAP ou CNES fora do ar),
      # usando as dimensões já publicadas. A execução continua marcada como falha.
      - name: Gerar tabelas do painel ATE
        if: always() && steps.extrair.outcome == 'success'
        run: Rscript painel_ate.R

      - name: Publicar base no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d dados ] || { echo "Nada para publicar."; exit 0; }
          git add -A dados
          if git diff --cached --quiet; then
            echo "Sem mudanças na base."
          else
            git commit -m "Atualiza base OCI SIA-PA PE ($(date +%Y-%m-%d))"
            git push
          fi
