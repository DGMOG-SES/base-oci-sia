name: Atualizar base OCI (SIA-PA PE)

on:
  push:
    branches: [main]
    paths:
      - "oci_sia_pe.R"
      - "instalar_pacotes.R"
      - ".github/workflows/atualizar_oci.yml"
  schedule:
    - cron: "0 10 * * *"   # todo dia às 07h de Brasília; só baixa quando há arquivo novo
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras (ex.: --forcar=202503 ou --reprocessar-tudo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-oci
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes
        run: Rscript instalar_pacotes.R

      - name: Extrair e consolidar
        run: Rscript oci_sia_pe.R ${{ github.event.inputs.argumentos }}

      - name: Publicar base no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/movimentos dados/controle dados/saida
          if git diff --cached --quiet; then
            echo "Sem mudanças na base."
          else
            git commit -m "Atualiza base OCI SIA-PA PE ($(date +%Y-%m-%d))"
            git push
          fi
